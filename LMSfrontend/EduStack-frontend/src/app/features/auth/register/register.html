<div class="auth-container">
  <div class="auth-content">
    <div class="auth-left">
      <div class="logo-container">
        <span class="logo-text"><span class="logo-edu">Edu</span><span class="logo-stack">Stack</span></span>
      </div>

      <div class="welcome-label">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4L12 2zm0 4.1L10.5 10.5 6.1 12l4.4 1.5L12 17.9l1.5-4.4L17.9 12l-4.4-1.5L12 6.1z" />
        </svg>
        Join Us
      </div>

      <h1 class="auth-heading">
        Start your
        <span class="auth-heading-highlight">learning journey.</span>
      </h1>

      <p class="auth-subheading">Create an account to access courses, mentors and streaks.</p>

      <div class="auth-pill">
        <a routerLink="/auth/login" class="tab">Sign In</a>
        <a routerLink="/auth/register" class="tab active">Create Account</a>
      </div>

      <!-- Error Message -->
      <div class="auth-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <form class="auth-form" (ngSubmit)="onRegister()">
        <div style="position: relative;">
          <label class="input-label">Full Name</label>
          <div class="input-group">
            <span class="icon user-icon"></span>
            <input type="text" [(ngModel)]="name" name="name" placeholder="John Doe" required />
          </div>
        </div>

        <div style="position: relative;">
          <label class="input-label">Email</label>
          <div class="input-group">
            <span class="icon user-icon"></span>
            <input type="email" [(ngModel)]="email" name="email" placeholder="you@edustack.io" required />
          </div>
        </div>

        <div style="position: relative;">
          <label class="input-label">I am a</label>
          <div class="input-group">
            <span class="icon role-icon"></span>
            <select [(ngModel)]="role" name="role" required>
              <option value="Student">Student</option>
              <option value="Instructor">Instructor</option>
            </select>
          </div>
        </div>

        <div style="position: relative;">
          <label class="input-label">Password</label>
          <div class="input-group">
            <span class="icon lock-icon"></span>
            <input type="password" [(ngModel)]="password" name="password" placeholder="Create a password" required />
          </div>
        </div>

        <div style="position: relative;">
          <label class="input-label">Confirm Password</label>
          <div class="input-group">
            <span class="icon lock-icon"></span>
            <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword"
              placeholder="Re-enter your password" required />
          </div>
          <div class="field-error" *ngIf="passwordMismatch">Passwords do not match</div>
        </div>

        <div class="form-options">
          <div class="checkbox-custom checked"></div>
          <span class="checkbox-label">I agree to Terms & Conditions</span>
        </div>

        <button type="submit" class="btn-primary" [disabled]="loading || passwordMismatch">
          {{ loading ? 'Creating Account...' : 'Create Account' }}
          <svg *ngIf="!loading" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
      </form>
    </div>
  </div>
</div>
