<div class="auth-container">
  <div class="auth-content">
    <div class="auth-left">
      <div class="logo-container">
        <span class="logo-text"><span class="logo-edu">Edu</span><span class="logo-stack">Stack</span></span>
      </div>

      <div class="welcome-label">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4L12 2zm0 4.1L10.5 10.5 6.1 12l4.4 1.5L12 17.9l1.5-4.4L17.9 12l-4.4-1.5L12 6.1z" />
        </svg>
        Reset Password
      </div>

      <h1 class="auth-heading">
        Create a
        <span class="auth-heading-highlight">new password.</span>
      </h1>

      <p class="auth-subheading">Enter the 6-digit OTP sent to your email along with your new password.</p>

      <!-- Success Message -->
      <div class="auth-success" *ngIf="successMessage">{{ successMessage }}</div>

      <!-- Error Message -->
      <div class="auth-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <form class="auth-form" (ngSubmit)="onSubmit()">
        <div style="position: relative;">
          <label class="input-label">Email</label>
          <div class="input-group">
            <span class="icon user-icon"></span>
            <input type="email" [(ngModel)]="email" name="email" placeholder="you@edustack.io" required />
          </div>
        </div>

        <div style="position: relative;">
          <label class="input-label">OTP Code</label>
          <div class="input-group">
            <span class="icon otp-icon"></span>
            <input type="text" [(ngModel)]="otpCode" name="otpCode" placeholder="Enter 6-digit OTP" maxlength="6"
              required />
          </div>
        </div>

        <div style="position: relative;">
          <label class="input-label">New Password</label>
          <div class="input-group">
            <span class="icon lock-icon"></span>
            <input type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="Enter new password"
              required />
          </div>
        </div>

        <div style="position: relative;">
          <label class="input-label">Confirm New Password</label>
          <div class="input-group">
            <span class="icon lock-icon"></span>
            <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword"
              placeholder="Re-enter new password" required />
          </div>
          <div class="field-error" *ngIf="passwordMismatch">Passwords do not match</div>
        </div>

        <button type="submit" class="btn-primary" [disabled]="loading || passwordMismatch"
          style="margin-top: 0.5rem;">
          {{ loading ? 'Resetting Password...' : 'Reset Password' }}
          <svg *ngIf="!loading" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
      </form>

      <a routerLink="/auth/login" class="auth-back-link">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Back to Sign In
      </a>
    </div>
  </div>
</div>
