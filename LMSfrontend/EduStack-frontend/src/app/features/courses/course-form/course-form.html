<div class="form-page" *ngIf="!pageLoading">
  <a routerLink="/instructor/my-courses" class="back-link">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    My Courses
  </a>

  <h1 class="form-title" *ngIf="!isEditMode">Create a <span class="highlight">New Course</span></h1>
  <h1 class="form-title" *ngIf="isEditMode">Edit <span class="highlight">Course</span></h1>
  <p class="form-sub">{{ isEditMode ? 'Update your course details below.' : 'Fill in the details to create your course. You can add sections & lessons next.' }}</p>

  <div class="form-error" *ngIf="errorMessage">{{ errorMessage }}</div>

  <form class="course-form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label class="form-label">Course Title</label>
      <input type="text" [(ngModel)]="title" name="title" placeholder="e.g. Angular for Beginners" required />
    </div>

    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea [(ngModel)]="description" name="description" rows="4" placeholder="What will students learn in this course?" required></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Price (₹)</label>
        <input type="number" [(ngModel)]="price" name="price" min="0" step="1" placeholder="0 for free" required />
      </div>
      <div class="form-group">
        <label class="form-label">Level</label>
        <select [(ngModel)]="level" name="level" required>
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Language</label>
        <input type="text" [(ngModel)]="language" name="language" placeholder="English" required />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Thumbnail URL</label>
      <input type="url" [(ngModel)]="thumbnailUrl" name="thumbnailUrl" placeholder="https://example.com/image.jpg" required />
    </div>

    <div class="thumb-preview" *ngIf="thumbnailUrl">
      <img [src]="thumbnailUrl" alt="Thumbnail preview" />
    </div>

    <button type="submit" class="btn-submit" [disabled]="loading">
      {{ loading ? 'Saving...' : (isEditMode ? 'Update Course' : 'Create Course') }}
      <svg *ngIf="!loading" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </form>
</div>

<div class="form-loading" *ngIf="pageLoading">
  <div class="spinner"></div>
  <p>Loading course...</p>
</div>
