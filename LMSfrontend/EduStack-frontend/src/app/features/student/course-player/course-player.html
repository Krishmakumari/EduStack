<div class="player-container" *ngIf="!loading && course && enrollment">
  <!-- Top Bar -->
  <div class="player-top">
    <div class="top-left">
      <a routerLink="/student/my-learning" class="back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <h2 class="course-title">{{ course.title }}</h2>
    </div>
    <div class="top-right">
      <div class="progress-info">
        <span class="progress-text">{{ progressPercentage }}% Complete</span>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" [style.width.%]="progressPercentage"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="player-main">
    <!-- Lesson Content Area -->
    <div class="content-area">
      <div class="video-placeholder" *ngIf="activeLesson?.videoUrl">
        <div class="mock-player">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <p>Video: {{ activeLesson?.videoUrl }}</p>
        </div>
      </div>
      
      <div class="lesson-header">
        <h1 class="lesson-title">{{ activeLesson?.title }}</h1>
        <button class="btn-complete" (click)="markComplete()" 
          [disabled]="completing || isLessonCompleted(activeLesson?.lessonId || '')"
          [class.completed]="isLessonCompleted(activeLesson?.lessonId || '')">
          <svg *ngIf="isLessonCompleted(activeLesson?.lessonId || '')" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
          {{ isLessonCompleted(activeLesson?.lessonId || '') ? 'Completed' : (completing ? 'Processing...' : 'Mark as Complete') }}
        </button>
      </div>

      <div class="lesson-body" *ngIf="activeLesson?.content">
        <div class="content-text" [innerHTML]="activeLesson?.content"></div>
      </div>
    </div>

    <!-- Sidebar Curriculum -->
    <div class="sidebar">
      <h3 class="sidebar-title">Course Content</h3>
      <div class="sidebar-scroll">
        <div class="section-item" *ngFor="let section of course.sections; let i = index">
          <div class="section-header">
            <span class="section-name">Section {{ i + 1 }}: {{ section.title }}</span>
          </div>
          <div class="lesson-list">
            <button class="lesson-btn" *ngFor="let lesson of section.lessons"
              (click)="selectLesson(lesson)"
              [class.active]="activeLesson?.lessonId === lesson.lessonId">
              <div class="lesson-info">
                <span class="status-icon" [class.done]="isLessonCompleted(lesson.lessonId)">
                  <svg *ngIf="isLessonCompleted(lesson.lessonId)" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><path d="M20 6L9 17l-5-5"/></svg>
                </span>
                <span class="lesson-name">{{ lesson.title }}</span>
              </div>
              <span class="lesson-duration" *ngIf="lesson.durationInSeconds > 0">
                {{ lesson.durationInSeconds / 60 | number:'1.0-0' }}m
              </span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Loading State -->
<div class="player-loading" *ngIf="loading && !errorMessage">
  <div class="spinner"></div>
  <p>Loading your classroom...</p>
</div>

<!-- Error State -->
<div class="player-error" *ngIf="errorMessage">
  <p>{{ errorMessage }}</p>
  <a routerLink="/student/my-learning" class="back-link">Back to Dashboard</a>
</div>
